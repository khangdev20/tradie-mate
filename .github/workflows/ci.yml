name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'cursor/**'

jobs:
  api:
    name: API build, type-check & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradiemate
          POSTGRES_PASSWORD: tradiemate
          POSTGRES_DB: tradiemate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradiemate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Build API
        run: npm run build -w tradie-mate-api

      - name: Type-check API
        run: npm run type-check -w tradie-mate-api
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://tradiemate:tradiemate@localhost:5432/tradiemate
          DIRECT_DATABASE_URL: postgres://tradiemate:tradiemate@localhost:5432/tradiemate
          REDIS_URL: redis://localhost:6379

      - name: Run API tests
        run: npm run test -w tradie-mate-api
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://tradiemate:tradiemate@localhost:5432/tradiemate
          DIRECT_DATABASE_URL: postgres://tradiemate:tradiemate@localhost:5432/tradiemate
          REDIS_URL: redis://localhost:6379

  mobile:
    name: Mobile type-check, tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tradie-mate-app/package-lock.json

      - name: Install mobile dependencies
        working-directory: tradie-mate-app
        run: npm ci --no-audit --no-fund

      - name: Type-check mobile
        working-directory: tradie-mate-app
        run: npm run type-check

      - name: Run mobile tests
        working-directory: tradie-mate-app
        run: npm test -- --runInBand

      - name: Lint mobile
        working-directory: tradie-mate-app
        run: npm run lint

  web:
    name: Web build, type-check & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web
        run: npm run build -w tradie-mate-web

      - name: Type-check web
        run: npm run type-check -w tradie-mate-web

      - name: Lint web
        run: npm run lint -w tradie-mate-web

  auto-merge:
    name: Auto-merge labeled PR
    needs: [api, mobile, web]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable GitHub auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --squash
